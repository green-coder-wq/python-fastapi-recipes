name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: isort
        run: isort .

      - name: black
        run: black .

      - name: flake8
        run: flake8 . --max-line-length=88 --extend-ignore=W293,W391,W292,E203

      - name: mypy
        run: mypy . --ignore-missing-imports || true

      - name: pytest
        run: pytest -v

      - name: Commit fixes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-fix by isort/black"
          git push || true
